name = "Rep Plus Net Reader"
version = "1.7"
description = "A model and view of a Rep Plus net (a CNet or KNet .rnet file, Brian Gaines's): its node and link types, nodes, links and marks, drawn as CNet drew them, built on the kernel of Gaines's protologic so the reasoners draw KNet's inferences, through conjunctions and disjunctions too, and propagate its truth marks, with its necessary and default marks (preferences), and finds its probes and the links they say hold; puts it in its minimal and maximal canonical forms, saturates it with its probes, and checks merges with other nets; expands its protoconnectives, adds anonymous nodes and factors its links; reports the senses in which its nodes exist; and abduces from a node, as KNet does."
sn-version = "1.1"
