name = "Rep Plus Net Reader"
version = "1.3"
description = "A model and view of a Rep Plus net (a CNet or KNet .rnet file, Brian Gaines's): its node and link types, nodes, links and marks, drawn as CNet drew them, built on the kernel of Gaines's protologic so the reasoners draw KNet's inferences, through conjunctions and disjunctions too, and propagate its truth marks."
sn-version = "1.1"
